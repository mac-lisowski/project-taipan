default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-em-dashes
        name: replace em dashes with hyphens
        entry: bash -c 'd=$(printf "\\342\\200\\224"); for f in "$@"; do sed -i.bak "s/$d/-/g" "$f" && rm "$f.bak"; done' --
        language: system
        types: [text]
        exclude: '^(\.agents/skills/|\.devin/|\.claude/|\.grok/|\.zcode/|uv\.lock$|skills-lock\.json$)'
      - id: file-size
        name: file size cap (300 LOC)
        entry: scripts/check-file-size.sh
        language: system
        pass_filenames: false
      - id: bff-boundary
        name: BFF boundary checks (apps/web)
        entry: scripts/check-bff.sh
        language: system
        pass_filenames: false
      - id: unreached-components
        name: unreachable component checks (apps/web)
        entry: scripts/check-unreached-components.sh
        language: system
        pass_filenames: false
      - id: docker-copy
        name: Dockerfile COPY sources resolve at repo root
        entry: scripts/check-docker.sh
        language: system
        pass_filenames: false
      - id: commit-msg-len
        name: commit message line cap (120 chars)
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: web-checks
        name: web lint + typecheck (apps/web)
        entry: bash -c 'cd apps/web && pnpm lint && pnpm exec next typegen && pnpm exec tsc --noEmit'
        language: system
        pass_filenames: false
        stages: [pre-push]
