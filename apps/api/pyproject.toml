[project]
name = "api"
version = "0.1.0"
description = "FastAPI composition root: auth, tenancy, field encryption"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4",
    "core",
    "crypto",
    "email",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "kms",
    "messaging",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
    "redis>=5.0",
    "sqlalchemy>=2.1.3",
    "storage",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
core = { workspace = true }
crypto = { workspace = true }
email = { workspace = true }
kms = { workspace = true }
messaging = { workspace = true }
storage = { workspace = true }

[project.scripts]
api = "api.main:main"
api-dev = "api.main:dev"
db-revision = "api.db_cli:revision"
db-upgrade = "api.db_cli:upgrade"
db-downgrade = "api.db_cli:downgrade"
db-current = "api.db_cli:current"
db-stamp = "api.db_cli:stamp"

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "watchfiles>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
