[project]
name = "api"
version = "0.1.0"
description = "Example API app depending on core"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "core",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "kms",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
core = { workspace = true }
kms = { workspace = true }

[project.scripts]
api = "api.main:main"
db-revision = "api.db_cli:revision"
db-upgrade = "api.db_cli:upgrade"
db-downgrade = "api.db_cli:downgrade"
db-current = "api.db_cli:current"
db-stamp = "api.db_cli:stamp"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
