# Railway profile of the broker. Only the client and monitor ports
# are open there: devices are not on Railway, so MQTT stays off.
# No auth: basic broker creds are the spec ceiling.

jetstream {
  store_dir: "/data"
}

# Client port for app services.
port: 4222

# Monitor endpoint. /healthz verifies JetStream recovery when JS is on,
# so a platform health check on 8222 is meaningful.
http: 8222
