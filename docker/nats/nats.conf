# One broker config for every stack: JetStream file store on the
# mounted volume, monitor for health checks, MQTT for devices.
# No auth: basic broker creds are the spec ceiling and private
# networks need none.

jetstream {
  store_dir: "/data"
}

# Monitor endpoint. /healthz verifies JetStream recovery when JS is on,
# so the compose healthcheck on 8222 is meaningful.
http: 8222

# Plain MQTT for devices; MQTT standalone mode requires JetStream.
mqtt {
  listen: "0.0.0.0:1883"
}
