[project]
name = "crypto"
version = "0.1.0"
description = "Tenant-aware field encryption: envelope engine over injected Cipher, DEK store and cache ports"
requires-python = ">=3.12"
dependencies = ["cryptography>=44", "kms"]

[tool.uv.sources]
kms = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crypto"
