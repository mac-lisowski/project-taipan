[project]
name = "storage"
version = "0.1.0"
description = "Object storage seam: provider-neutral store port with S3 and fake adapters"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.20",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "storage"
