[project]
name = "email"
version = "0.1.0"
description = "Email delivery seam: sender interface with fake adapter for dev and tests"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "jinja2>=3.1",
    "resend>=2.49.1",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "email_delivery"
