[project]
name = "kms"
version = "0.1.0"
description = "KMS port and Infisical adapter for encrypt, decrypt and key provisioning"
requires-python = ">=3.12"
dependencies = ["httpx2>=2.13.1"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kms"
