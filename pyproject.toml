[project]
name = "project-taipan"
version = "0.1.0"
description = "Monorepo for my Python projects"
requires-python = ">=3.12"
dependencies = [
    "api",
    "core",
    "cli",
]

[tool.uv.sources]
api = { workspace = true }
core = { workspace = true }
cli = { workspace = true }

# Workspace members: shared libraries live in packages/, runnable apps in apps/
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent skills are third-party code; never lint or format them.
# alembic/ is generated by `alembic init`/`revision` (env.py is config-wired).
extend-exclude = [".agents/skills", ".claude", ".devin", ".grok", ".zcode", "**/alembic/"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
