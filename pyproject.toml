[project]
name = "python-playground"
version = "0.1.0"
description = "Monorepo for my Python projects"
requires-python = ">=3.12"
dependencies = [
    "api",
    "core",
    "cli",
]

[tool.uv.sources]
api = { workspace = true }
core = { workspace = true }
cli = { workspace = true }

# Workspace members: shared libraries live in packages/, runnable apps in apps/
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
