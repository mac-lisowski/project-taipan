# Self-contained devcontainer stack. Not merged with the root
# docker-compose.yaml: its "5432:5432" publish would collide on the host.
# The db service here publishes no host port. The app service reaches it
# over the compose network as host "db".

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    # Root on purpose: this host runs rootless Docker, where host uid
    # 1000 maps to container uid 0. A non-root user cannot write the
    # bind-mounted repo. On a rootful host you can use a normal user.
    user: root
    volumes:
      - ..:/workspaces/project-taipan:cached
      # Mask the host-built .venv. Its absolute paths are invalid here.
      - devcontainer-venv:/workspaces/project-taipan/.venv
      - devcontainer-uvcache:/root/.cache/uv
    environment:
      HOME: /root
      API_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      API_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      API_TEST_URL: postgresql+psycopg://postgres:postgres@db:5432/app_test
      # DEK cache (L2 tier) for field encryption. Sessions live in
      # Postgres, not here.
      API_REDIS_URL: redis://redis:6379/0
      # Self-hosted secrets/KMS service, reachable on this network.
      API_INFISICAL_URL: http://infisical:8080
      # Object store, reachable on this network.
      API_S3_ENDPOINT: http://minio:9000
      # Broker on this network; host "nats", like db above.
      API_BROKER_URL: nats://nats:4222
      # testcontainers spawns into the sibling dind daemon.
      DOCKER_HOST: tcp://dind:2375
    depends_on:
      db:
        condition: service_healthy
      dind:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_healthy

  # Docker-in-Docker daemon for testcontainers. Privileged by design.
  # TLS off: only reachable on this private compose network.
  dind:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - devcontainer-dind:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object store. chainguard/minio pinned by digest: MinIO removed its
  # Docker images, and Chainguard publishes no versioned tag, only
  # latest, so a digest is the only reproducible pin (MinIO
  # RELEASE.2026-09-22T19-25-18Z). No host ports: parity with db, the
  # root stack owns 9000/9001. No healthcheck: the image is shell-less
  # (no curl, no bash). No minio-init service: the API creates the
  # bucket on first upload.
  minio:
    image: chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: taipan
      MINIO_ROOT_PASSWORD: taipan-dev-secret
    volumes:
      - devcontainer-minio-data:/data

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dedicated Postgres for Infisical - mirrors the cloud setup.
  infisical-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical
      POSTGRES_DB: infisical
    volumes:
      - devcontainer-infisical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Broker on the compose network only, like db above: no host ports.
  # The app reaches it as host "nats" via API_BROKER_URL.
  nats:
    image: nats:2.15-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - devcontainer-natsdata:/data
      - ../docker/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No host port publish: keeps parity with db above (the root stack
  # owns 8080 for the same reason db owns 5432 there).
  infisical:
    build:
      context: ..
      dockerfile: docker/infisical/Dockerfile
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-acd3c124a3551e4ebfc938dd6c324df4}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-5rAezL8iu7mu1uzfOMoXH8bt7zoPUEfZM470M9AT8jc=}
      DB_CONNECTION_URI: postgresql://infisical:infisical@infisical-db:5432/infisical
      REDIS_URL: redis://redis:6379/1
      SITE_URL: http://localhost:8080
    depends_on:
      infisical-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated Postgres for LiteLLM - mirrors the host stack.
  litellm-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - devcontainer-litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No host port publish: the root stack owns 4000, so both stacks
  # can run at once. Reach it in-network at http://litellm:4000.
  litellm:
    build:
      context: ..
      dockerfile: docker/litellm/Dockerfile
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-taipan-dev-4f8a2c91e6b3d705}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-taipan-salt-9b1c64e2a8d3f704}
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      litellm-db:
        condition: service_healthy

volumes:
  devcontainer-pgdata:
  devcontainer-minio-data:
  devcontainer-venv:
  devcontainer-uvcache:
  devcontainer-dind:
  devcontainer-infisical-pgdata:
  devcontainer-litellm-pgdata:
  devcontainer-natsdata:
