services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dedicated Postgres for Infisical - mirrors the cloud setup where
  # the secrets store gets its own instance, not a db inside app pg.
  # No host port: only the infisical service talks to it.
  infisical-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical
      POSTGRES_DB: infisical
    volumes:
      - infisical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 3s
      retries: 10

  infisical:
    build:
      context: .
      dockerfile: docker/infisical/Dockerfile
    environment:
      # Dev-only defaults, committed like POSTGRES_PASSWORD. Prod
      # values are Railway variables - losing ENCRYPTION_KEY makes
      # every stored secret unreadable.
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-acd3c124a3551e4ebfc938dd6c324df4}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-5rAezL8iu7mu1uzfOMoXH8bt7zoPUEfZM470M9AT8jc=}
      DB_CONNECTION_URI: postgresql://infisical:infisical@infisical-db:5432/infisical
      REDIS_URL: redis://redis:6379/1
      SITE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      infisical-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated Postgres for LiteLLM - the gateway keeps its models and
  # keys in a separate instance, same shape as Infisical. No host
  # port: only the litellm service talks to it.
  litellm-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    build:
      context: .
      dockerfile: docker/litellm/Dockerfile
    environment:
      # Dev-only defaults, committed like POSTGRES_PASSWORD. Prod
      # values are Railway variables. Repo-private defaults because
      # v1.104.0 refuses to boot on LiteLLM's documented example key.
      # Losing the salt key makes stored provider credentials
      # unreadable, so the default stays stable.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-taipan-dev-4f8a2c91e6b3d705}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-taipan-salt-9b1c64e2a8d3f704}
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    ports:
      - "4000:4000"
    depends_on:
      litellm-db:
        condition: service_healthy

volumes:
  pgdata:
  infisical-pgdata:
  litellm-pgdata:
