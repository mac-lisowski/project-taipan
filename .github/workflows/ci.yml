name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
            core:
              - 'packages/core/**'
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'docker-compose.yaml'
              - 'docker/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: no em dashes in tracked files
        run: |
          rc=0
          files=$(git grep -lP '\x{2014}' -- . ':!uv.lock' ':!skills-lock.json' ':!.agents/skills' ':!.devin' ':!.claude' ':!.grok' ':!.zcode') || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          if [ -n "$files" ]; then printf 'em dash found in:\n%s\n' "$files"; exit 1; fi

  test-core:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest packages/core

  test-api:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest apps/api

  ci-done:
    needs: [changes, lint, test-core, test-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify required jobs passed
        run: |
          status=0
          for pair in "changes:${{ needs.changes.result }}" "lint:${{ needs.lint.result }}" "test-core:${{ needs.test-core.result }}" "test-api:${{ needs.test-api.result }}"; do
            result="${pair##*:}"
            echo "${pair%%:*}: $result"
            case "$result" in success|skipped) ;; *) status=1 ;; esac
          done
          exit $status
