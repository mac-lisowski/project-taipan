name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      crypto: ${{ steps.filter.outputs.crypto }}
      kms: ${{ steps.filter.outputs.kms }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
              - 'scripts/**'
              - '.dockerignore'
              - '**/Dockerfile*'
            web:
              - 'apps/web/**'
            core:
              - 'packages/core/**'
            crypto:
              - 'packages/crypto/**'
            kms:
              - 'packages/kms/**'
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/crypto/**'
              - 'packages/kms/**'
              - 'docker-compose.yaml'
              - 'docker/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: no em dashes in tracked files
        run: |
          rc=0
          files=$(git grep -lP '\x{2014}' -- . ':!uv.lock' ':!skills-lock.json' ':!.agents/skills' ':!.devin' ':!.claude' ':!.grok' ':!.zcode') || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          if [ -n "$files" ]; then printf 'em dash found in:\n%s\n' "$files"; exit 1; fi
      - name: file size cap
        run: scripts/check-file-size.sh
      - name: BFF boundary checks
        run: scripts/check-bff.sh
      - name: unreached components check
        run: scripts/check-unreached-components.sh
      - name: Dockerfile COPY sources
        run: scripts/check-docker.sh
      - name: compose files validate
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f .devcontainer/docker-compose.yml config -q

  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n' "${{ github.event.pull_request.title }}" > /tmp/pr-title.txt
            scripts/check-commit-msg.sh /tmp/pr-title.txt
          else
            before="${{ github.event.before }}"
            case "$before" in
              0000000000000000000000000000000000000000|"") range="HEAD" ;;
              *) range="$before..${{ github.sha }}" ;;
            esac
            fail=0
            for c in $(git log --format=%H "$range"); do
              git log -1 --format=%B "$c" > /tmp/commit-msg.txt
              scripts/check-commit-msg.sh /tmp/commit-msg.txt || fail=1
            done
            exit $fail
          fi
      - name: lint branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-branch-name.sh "${{ github.head_ref }}"
          else
            scripts/check-branch-name.sh "${{ github.ref_name }}"
          fi
      - name: shell gate tests and docs sync
        run: |
          bash scripts/tests/test-commit-msg.sh
          bash scripts/tests/test-branch-name.sh

  test-web:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must exist before setup-node resolves the pnpm cache.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # packageManager field lives in the app, not the repo root.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web lint
      # LayoutProps/PageProps are generated; tsc fails without them.
      - run: pnpm -C apps/web exec next typegen
      - run: pnpm -C apps/web exec tsc --noEmit
      - run: pnpm -C apps/web test
      - run: pnpm -C apps/web build
      - run: scripts/docker-build.sh web
      - name: web image smoke test
        run: |
          docker run -d --name web -p 127.0.0.1:0:3000 taipan-web
          port=$(docker port web 3000 | cut -d: -f2)
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://localhost:$port/" && exit 0 || sleep 1
          done
          docker logs web
          exit 1

  test-core:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest packages/core

  test-crypto:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.crypto == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest packages/crypto

  test-kms:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.kms == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest packages/kms

  test-api:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest apps/api
      - run: scripts/docker-build.sh api
      - name: api image smoke test
        run: docker run --rm taipan-api python -c "import api.main"

  ci-done:
    needs: [changes, lint, commit-lint, test-core, test-crypto, test-kms, test-api, test-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify required jobs passed
        run: |
          status=0
          for pair in "changes:${{ needs.changes.result }}" "lint:${{ needs.lint.result }}" "commit-lint:${{ needs.commit-lint.result }}" "test-core:${{ needs.test-core.result }}" "test-crypto:${{ needs.test-crypto.result }}" "test-kms:${{ needs.test-kms.result }}" "test-api:${{ needs.test-api.result }}" "test-web:${{ needs.test-web.result }}"; do
            result="${pair##*:}"
            echo "${pair%%:*}: $result"
            case "$result" in success|skipped) ;; *) status=1 ;; esac
          done
          exit $status

  deploy:
    needs: ci-done
    # always() is required: a skipped job anywhere upstream (changes on
    # push) otherwise propagates a skip through the needs chain even
    # when ci-done succeeded.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-done.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Literal: selects which GitHub environment's secrets/vars resolve.
    environment: project-taipan / dev
    env:
      # Everything the deploy job needs lives in environment secrets:
      # service names and ids are infrastructure identifiers, and the
      # project token must never sit in a collaborator-readable var.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE_WEB: ${{ secrets.RAILWAY_SERVICE_WEB }}
      RAILWAY_SERVICE_API: ${{ secrets.RAILWAY_SERVICE_API }}
      RAILWAY_SERVICE_INFISICAL: ${{ secrets.RAILWAY_SERVICE_INFISICAL }}
      RAILWAY_SERVICE_LITELLM: ${{ secrets.RAILWAY_SERVICE_LITELLM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install railway cli
        run: npm install -g @railway/cli@5.41.2
      - name: deploy web
        timeout-minutes: 10
        run: railway up --service "$RAILWAY_SERVICE_WEB" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci
      - name: deploy api
        timeout-minutes: 10
        run: railway up --service "$RAILWAY_SERVICE_API" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci
      - name: deploy infisical
        # Skipped until the Railway service exists and the GitHub
        # environment secret RAILWAY_SERVICE_INFISICAL is set.
        if: ${{ secrets.RAILWAY_SERVICE_INFISICAL != '' }}
        timeout-minutes: 10
        run: railway up --service "$RAILWAY_SERVICE_INFISICAL" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci
      - name: deploy litellm
        # Skipped until the Railway service exists (with its Dockerfile
        # builder set to docker/litellm/Dockerfile) and the GitHub
        # environment secret RAILWAY_SERVICE_LITELLM is set.
        if: ${{ secrets.RAILWAY_SERVICE_LITELLM != '' }}
        timeout-minutes: 10
        run: railway up --service "$RAILWAY_SERVICE_LITELLM" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci
